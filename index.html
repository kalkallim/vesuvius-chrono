<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">

<title>Ancient Chronology Timeline v8.1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1e;
    color: #e8e4d8;
    font-family: 'Georgia', 'Times New Roman', serif;
    padding: 24px 12px;
    min-height: 100vh;
  }

  .chart-wrapper { width: 100%; max-width: min(1600px, calc(90vh * 1600 / 946)); margin: 0 auto; }

  svg { display: block; width: 100%; height: auto; min-width: 320px; }

  #tooltip {
    position: fixed;
    background: rgba(8,8,12,0.97);
    border: 1px solid #c8b98a;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    pointer-events: none;
    z-index: 9999;
    max-width: 320px;
    display: none;
    box-shadow: 0 4px 24px rgba(0,0,0,0.7);
    line-height: 1.7;
  }

  .tt-name  { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing:.08em; margin-bottom:3px; }

  .tt-top   { color: #ffffff; font-weight: bold; font-size: 13px; }

  .tt-bot   { color: #ffffff; font-weight: bold; font-size: 13px; }

  .tt-segs  { margin-top:6px; border-top:1px solid #2a2a2a; padding-top:5px; }

  .year-finder {
    max-width: 1600px;
    margin: 0 auto 14px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .year-finder label {
    font-size: 21px;
    color: #ffffff;
    font-style: italic;
    font-family: Georgia, serif;
  }

  #yearInput {
    width: 130px;
    background: #252530;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e8e4d8;
    font-size: 21px;
    font-family: Georgia, serif;
    padding: 7px 12px;
    text-align: center;
  }

  #yearInput:focus { outline: none; border-color: #c8b98a; }

  .era-toggle { display: flex; gap: 6px; }

  .era-toggle button {
    background: #252530;
    border: 1px solid #ffffff;
    color: #ffffff;
    font-size: 21px;
    font-family: Georgia, serif;
    padding: 7px 16px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }

  #btnBC.active { background: #27AE60; color: #fff; border-color: #27AE60; font-weight: 700; }

  #btnAD.active { background: #27AE60; color: #fff; border-color: #27AE60; font-weight: 700; }

  .era-toggle button:not(.active):hover { background: #1e3a2a; }

  #findBtn {
    background: #27AE60;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 21px;
    font-family: Georgia, serif;
    font-weight: 700;
    padding: 8px 20px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  #findBtn:hover { background: #2ecc71; }

  .finder-nav { display: flex; gap: 6px; }

  .finder-nav button {
    background: #27AE60;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 21px;
    font-family: Georgia, serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
  }

  .finder-nav button:hover { background: #2ecc71; }

  #yearOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #1a1a1e;
    z-index: 99999;
    padding: 24px 20px;
    overflow-y: auto;
    flex-direction: column;
  }

  #yearOverlay.active { display: flex; }

  .overlay-controls { align-self: flex-start; display: flex; flex-direction: column; }

  .overlay-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    width: 100%;
  }

  #overlayBack {
    background: #27AE60;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 17px;
    font-family: Georgia, serif;
    font-weight: 700;
    padding: 0 18px;
    height: 36px;
    cursor: pointer;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #overlayBack .back-arrow { font-size: 20px; line-height: 1; }

  #overlayBack:hover { background: #2ecc71; }

  .overlay-nav { display: flex; gap: 6px; }

  .overlay-nav button {
    background: #27AE60;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 20px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .overlay-nav button:hover { background: #2ecc71; }

  #overlayFinder {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    width: 100%;
  }

  #overlayInput {
    flex: 1;
    min-width: 50px;
    background: #252530;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e8e4d8;
    font-size: 17px;
    font-family: Georgia, serif;
    padding: 0 10px;
    height: 36px;
    text-align: center;
  }

  #overlayInput:focus { outline: none; border-color: #c8b98a; }

  #overlayFindBtn {
    background: #27AE60;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 17px;
    font-family: Georgia, serif;
    font-weight: 700;
    height: 36px;
    padding: 0 16px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  #overlayFindBtn:hover { background: #2ecc71; }

  .overlay-era { display: flex; gap: 6px; }

  .overlay-era button {
    background: #252530;
    border: 1px solid #fff;
    color: #fff;
    font-size: 16px;
    font-family: Georgia, serif;
    height: 36px;
    padding: 0 13px;
    cursor: pointer;
    border-radius: 4px;
  }

  #overlayBC.active, #overlayAD.active { background: #27AE60; border-color: #27AE60; font-weight: 700; }

  #overlayContent {
    font-size: 13px;
    color: #e8e4d8;
    font-family: Georgia, serif;
    line-height: 1.4;
  }

  #overlayContent .yr-axis-label { font-size: 14px; }

  #overlayContent .yr-main-date { font-size: 20px; }

  #overlayContent .yr-axis-tag   { font-size: 14px; }

  #overlayContent .yr-comp-date  { font-size: 14px; }

  #overlayContent .yr-comp-num   { font-size: 14px; }

  #overlayContent .yr-row { font-size: 13px; margin-bottom: 1px; white-space: nowrap; }

  #overlayContent .yr-rows { margin-top: 4px; padding-top: 4px; }

  #overlayContent .yr-top-date, #overlayContent .yr-bot-date { font-size: 13px; }

  #yearResult {
    font-size: clamp(15px, 1.5vw, 19px);
    color: #e8e4d8;
    font-family: Georgia, serif;
    display: none;
    background: rgba(8,8,12,0.97);
    border: 1px solid #c8b98a;
    border-radius: 6px;
    padding: 8px 14px;
    width: 100%;
    max-width: min(1600px, calc(90vh * 1600 / 946));
    box-sizing: border-box;
    line-height: 1.35;
    box-shadow: 0 4px 24px rgba(0,0,0,0.7);
    margin: 6px auto 6px;
  }

  .yr-double {
    display: flex;
    gap: 16px;
  }

  .yr-double > div {
    flex: 1 1 0;
    min-width: 0;
  }

  .yr-double .yr-divider {
    width: 1px;
    background: #333;
    margin: 0;
    flex: none;
  }

  .yr-main-date  { color: #ffffff; font-weight: bold; font-size: clamp(20px,1.9vw,25px); }

  .yr-axis-tag   { color: #e8e4d8; font-size: clamp(14px,1.3vw,17px); font-weight: normal; margin-left: 4px; }

  .yr-comp-date  { color: #e8e4d8; font-size: clamp(13px,1.2vw,16px); margin-bottom:3px; }

  .yr-comp-num   { color: #ffffff; font-size: clamp(16px,1.5vw,20px); font-weight: bold; }

  .yr-axis-label { color: #c8b98a; font-weight: bold; font-size: 13px; margin-bottom: 3px; }

  .yr-top-date   { color: #7DC4A0; font-weight: bold; }

  .yr-bot-date   { color: #7aafd4; font-weight: bold; }

  .yr-rows  { margin-top: 4px; border-top: 1px solid #2a2a2a; padding-top: 3px; }

  .yr-row   { font-size: 15px; color: #888; margin-bottom: 1px; white-space: nowrap; }

  .yr-row span { color: #c8b98a; }

  .yr-divider { border-top: 1px solid #333; margin: 4px 0; }
</style>

const svg       = document.getElementById('chart');
const overlay   = document.getElementById('hover-overlay');
const crosshair = document.getElementById('crosshair');
const tooltip   = document.getElementById('tooltip');

function getSVGX(evt) {
  const rect = svg.getBoundingClientRect();
  return (evt.clientX - rect.left) * (1600 / rect.width);
}

function vatAM(svgX) {
  return (svgX - 292) / PX_PER_YR + 1;
}

function amDisplay(raw) {
  const r = Math.round(raw);
  if (r === 0) return raw > 0 ? 1 : -1;
  if (r < 0)  return r - 1;
  return r;
}

function getRowAM(row, svgX) {
  const vat = vatAM(svgX);
  const offset = row.amOffset || 0;
  return amDisplay(vat + offset);
}

function getActiveSeg(row, svgX) {
  for (const seg of row.segments) {
    if (svgX >= seg.x && svgX <= seg.x + seg.w) return seg;
  }
  return null;
}

let _lastTouchEnd = 0;
overlay.addEventListener('mousemove', (evt) => {
  if (Date.now() - _lastTouchEnd < 500) return;  // suppress synthetic mouse after touch
  const svgX = getSVGX(evt);
  if (svgX < PLOT_X0 || svgX > PLOT_X0 + PLOT_W) return;

  crosshair.setAttribute('x1', svgX);
  crosshair.setAttribute('x2', svgX);
  crosshair.setAttribute('opacity', '0.7');

  const amVal   = vatAM(svgX);
  const topYr   = amVal >= 3760.5 ? amVal - 3760 : amVal - 3761;
  const botYr   = amVal > 5312.5 ? 5312 - amVal : 5313 - amVal;

  let segHTML = '';
  for (const row of ROWS) {
    const amCursor = getRowAM(row, svgX);
    if (amCursor === null) continue;
    const tc = segColor(row, svgX);
    const activeSeg = getActiveSeg(row, svgX);
    let labelText = '\u2014';
    if (activeSeg) {
      labelText = activeSeg.label;
    } else {
      let lastSeg = null;
      for (const seg of row.segments) { if (seg.x <= svgX) lastSeg = seg; }
      if (lastSeg) labelText = lastSeg.label;
    }
    segHTML += `<div style="margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #1e1e1e">` +
      `<div style="font-size:12px;font-weight:600;color:${tc}">${row.shortName} ${amCursor} AM</div>` +
      `<div style="font-size:11px;color:#666">${labelText}</div>` +
      `</div>`;
  }

  tooltip.innerHTML =
    `<div class="tt-name">Cursor position</div>` +
    `<div class="tt-top"><span style="color:#666;font-weight:normal">Upper Axis: </span>${fmtTop(topYr)}</div>` +
    `<div class="tt-bot"><span style="color:#666;font-weight:normal">Lower Axis: </span>${fmtBot(botYr)}</div>` +
    (segHTML ? `<div class="tt-segs">${segHTML}</div>` : '');

  const ttW = 320;
  const ttH = tooltip.scrollHeight || 200;
  const margin = 14;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  let left = evt.clientX + margin;
  if (left + ttW > vw - 4) left = evt.clientX - ttW - margin;
  if (left < 4) left = 4;

  let top = evt.clientY - 12;
  if (top + ttH > vh - 4) top = vh - ttH - 4;
  if (top < 4) top = 4;

  tooltip.style.left    = left + 'px';
  tooltip.style.top     = top + 'px';
  tooltip.style.display = 'block';
});

overlay.addEventListener('mouseleave', () => {
  crosshair.setAttribute('opacity', '0');
  tooltip.style.display = 'none';
});

overlay.addEventListener('click', (evt) => {
  const svgX = getSVGX(evt);
  if (svgX < PLOT_X0 || svgX > PLOT_X0 + PLOT_W) return;
  const amVal  = vatAM(svgX);
  const topYr  = amVal >= 3760.5 ? amVal - 3760 : amVal - 3761;
  const isBC   = topYr <= 0;
  const val    = Math.max(1, Math.round(isBC ? -topYr : topYr));
  const era    = isBC ? 'BC' : 'AD';
  document.getElementById('yearInput').value = val;
  currentEra = era;
  document.getElementById('btnBC').classList.toggle('active', isBC);
  document.getElementById('btnAD').classList.toggle('active', !isBC);
  syncOverlayInput(val, era);
  findYear();
  const res = document.getElementById('yearResult');
  if (res) res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

overlay.addEventListener('touchmove', (evt) => {
  evt.preventDefault();
  const t = evt.touches[0];
  overlay.dispatchEvent(new MouseEvent('mousemove', {clientX:t.clientX, clientY:t.clientY}));
}, {passive:false});

overlay.addEventListener('touchend', (evt) => {
  crosshair.setAttribute('opacity', '0');
  tooltip.style.display = 'none';
  _lastTouchEnd = Date.now();        // prevent synthetic mousemove re-showing TT
  if (evt.changedTouches.length === 1) {
    const t = evt.changedTouches[0];
    overlay.dispatchEvent(new MouseEvent('click', {clientX:t.clientX, clientY:t.clientY}));
  }
});

let currentEra = 'BC';
let lastX1 = null, lastX2 = null;
let overlayVal = 1, overlayEra = 'BC';

function setEra(era) {
  currentEra = era; overlayEra = era;
  document.getElementById('btnBC').classList.toggle('active', era === 'BC');
  document.getElementById('btnAD').classList.toggle('active', era === 'AD');
  document.getElementById('overlayBC').classList.toggle('active', era === 'BC');
  document.getElementById('overlayAD').classList.toggle('active', era === 'AD');
  autoFind();
}
function syncOverlayInput(val, era) {
  document.getElementById('overlayInput').value = val;
  document.getElementById('overlayBC').classList.toggle('active', era === 'BC');
  document.getElementById('overlayAD').classList.toggle('active', era === 'AD');
}
function setOverlayEra(era) {
  currentEra = era; overlayEra = era;
  document.getElementById('overlayBC').classList.toggle('active', era === 'BC');
  document.getElementById('overlayAD').classList.toggle('active', era === 'AD');
  document.getElementById('btnBC').classList.toggle('active', era === 'BC');
  document.getElementById('btnAD').classList.toggle('active', era === 'AD');
  const v = parseInt(document.getElementById('overlayInput').value);
  if (v >= 1) { document.getElementById('yearInput').value = v; findYear(); }
}
function overlayFindBtn() {
  const v = parseInt(document.getElementById('overlayInput').value);
  if (!isNaN(v) && v >= 1) document.getElementById('yearInput').value = v;
  findYear();
}

document.getElementById('yearInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') findYear();
});

function compBot(T) {

  if (T > 1552) return 1552 - T;
  if (T > 0)    return 1553 - T;
  return -T + 1552;
}
function compTop(B) {

  if (B > 1552) return 1552 - B;
  if (B >= 0)   return 1553 - B;
  return 1552 - B;
}

function segColor(row, x) {

  const am = Math.round(vatAM(x) + (row.amOffset || 0));
  if (am < 1) return '#888';
  function colorOf(seg) {
    return ['#1a1a1a','#555'].includes(seg.color) ? '#bbb'
         : (seg.color === '#e8e4d8' || seg.color === '#aaa') ? '#666'
         : seg.color;
  }
  let cum = 0;
  for (const seg of row.segments) {
    cum += seg.years;
    if (am <= cum + 1) return colorOf(seg);
  }
  return colorOf(row.segments[row.segments.length - 1]);
}

function buildOccurrence(svgX, axisLabel, hideTop, compYear) {
  const dashIdx  = axisLabel.indexOf(' — ');
  const mainDate = dashIdx > 0 ? axisLabel.slice(0, dashIdx) : axisLabel;
  const axisName = dashIdx > 0 ? axisLabel.slice(dashIdx + 3) : '';
  let html = `<div style="margin-bottom:1px"><span class="yr-main-date">${mainDate}</span><span class="yr-axis-tag">${axisName}</span></div>`;
  if (hideTop) {
    html += `<div style="margin-bottom:1px"><span class="yr-comp-num">${fmtBot(compYear)}</span><span class="yr-axis-tag">Lower Axis</span></div>`;
  } else {
    html += `<div style="margin-bottom:1px"><span class="yr-comp-num">${fmtTop(compYear)}</span><span class="yr-axis-tag">Upper Axis</span></div>`;
  }
  html += `<div class="yr-rows">`;
  for (const row of ROWS) {
    const am = getRowAM(row, svgX);
    if (am === null) continue;
    const rc = segColor(row, svgX);
    html += `<div class="yr-row">${row.shortName}: <span style="color:${rc}">${am} AM</span></div>`;
  }
  html += `</div>`;
  return html;
}

function isMobile() {
  return window.innerWidth < 700 || ('ontouchstart' in window && window.innerWidth < 1024);
}

function closeOverlay() {
  document.getElementById('yearOverlay').classList.remove('active');
}

function autoFind() {
  const val = document.getElementById('yearInput').value;
  if (val && parseInt(val) >= 1) findYear();
}

function setBarAnn(prefix, svgX, _label) {
  const _amVal = vatAM(svgX);
  const _topYr = _amVal >= 3760.5 ? _amVal - 3760 : _amVal - 3761;
  const _botYr = _amVal > 5312.5  ? 5312 - _amVal  : 5313 - _amVal;
  const topLbl = fmtTop(_topYr);
  const botLbl = fmtBot(_botYr);
  const lOff = document.getElementById(prefix + '-off-line');
  const tOff = document.getElementById(prefix + '-off-text');
  const lTer = document.getElementById(prefix + '-ter-line');
  const tTer = document.getElementById(prefix + '-ter-text');
  const rOff = document.getElementById(prefix + '-off-rect');
  const rTer = document.getElementById(prefix + '-ter-rect');
  const x = Math.round(svgX);
  const pad = 5, textX = x - pad - 2;

  [lOff, lTer].forEach(l => { l.setAttribute('x1',x); l.setAttribute('x2',x); l.setAttribute('opacity','0.9'); });

  tOff.setAttribute('x', textX); tOff.setAttribute('text-anchor','end');
  tOff.textContent = topLbl; tOff.setAttribute('opacity','1');

  tTer.setAttribute('x', textX); tTer.setAttribute('text-anchor','end');
  tTer.textContent = botLbl; tTer.setAttribute('opacity','1');

  const wOff = topLbl.length * 15.6, wTer = botLbl.length * 15.6;
  rOff.setAttribute('x', x - wOff - pad*2 - 2); rOff.setAttribute('y','125');
  rOff.setAttribute('width', wOff + pad*2); rOff.setAttribute('height','28'); rOff.setAttribute('opacity','1');
  rTer.setAttribute('x', x - wTer - pad*2 - 2); rTer.setAttribute('y','611');
  rTer.setAttribute('width', wTer + pad*2); rTer.setAttribute('height','28'); rTer.setAttribute('opacity','1');
}

function clearBarAnn(prefix) {
  ['off-line','off-text','ter-line','ter-text','off-rect','ter-rect'].forEach(id => {
    document.getElementById(prefix + '-' + id).setAttribute('opacity', '0');
  });
}

function finderNav(delta) {
  const raw = parseInt(document.getElementById('yearInput').value);
  let val = (isNaN(raw) || raw < 1) ? 423 : raw;
  let era = (isNaN(raw) || raw < 1) ? 'BC' : currentEra;

  let newVal, newEra = era;
  if (era === 'BC') {
    newVal = val - delta;
    if (newVal < 1) { newEra = 'AD'; newVal = 1; }
  } else {
    newVal = val + delta;
    if (newVal < 1) { newEra = 'BC'; newVal = 1; }
  }
  document.getElementById('yearInput').value = newVal;
  currentEra = newEra;
  overlayVal = newVal; overlayEra = newEra;
  document.getElementById('btnBC').classList.toggle('active', newEra === 'BC');
  document.getElementById('btnAD').classList.toggle('active', newEra === 'AD');
  syncOverlayInput(newVal, newEra);
  findYear();
}

function navYear(delta) {

  let v, newEra = overlayEra;
  if (overlayEra === 'BC') {
    v = overlayVal - delta;
    if (v < 1) { newEra = 'AD'; v = 1; }
  } else {
    v = overlayVal + delta;
    if (v < 1) { newEra = 'BC'; v = 1; }
  }
  overlayVal = v;
  overlayEra = newEra;
  currentEra = newEra;
  document.getElementById('yearInput').value = v;
  document.getElementById('btnBC').classList.toggle('active', newEra === 'BC');
  document.getElementById('btnAD').classList.toggle('active', newEra === 'AD');
  syncOverlayInput(v, newEra);
  findYear();
}

function findYear() {
  let val = parseInt(document.getElementById('yearInput').value);
  if (isNaN(val) || val < 1) {
    val = 423; currentEra = 'BC'; overlayVal = 423; overlayEra = 'BC';
    document.getElementById('yearInput').value = 423;
    document.getElementById('btnBC').classList.add('active');
    document.getElementById('btnAD').classList.remove('active');
    syncOverlayInput(423, 'BC');
  }

  const isBC = currentEra === 'BC';

  const yr_top = isBC ? -val : val;
  const yr_bot = isBC ? val : -val;

  const x_top = 292 + ((yr_top > 0 ? yr_top - 1 : yr_top) + 3760) * PX_PER_YR;
  const x_bot = 292 + (yr_bot < 0 ? 5311 - yr_bot : 5312 - yr_bot) * PX_PER_YR;

  const in_top = x_top >= PLOT_X0 && x_top <= PLOT_X0 + PLOT_W;
  const in_bot = x_bot >= PLOT_X0 && x_bot <= PLOT_X0 + PLOT_W;
  const is_double = in_top && in_bot && Math.abs(x_top - x_bot) > 2;

  const line1 = document.getElementById('finder-line-1');
  const line2 = document.getElementById('finder-line-2');

  lastX1 = null; lastX2 = null;

  line1.setAttribute('opacity', '0');
  line2.setAttribute('opacity', '0');
  clearBarAnn('ann1'); clearBarAnn('ann2');

  const result = document.getElementById('yearResult');

  if (!in_top && !in_bot) {
    result.innerHTML = `<span style="color:#888">${val} ${currentEra} is outside the chart range.</span>`;
    result.style.display = 'block';
    return;
  }

  let topHtml = '';
  let botHtml = '';

  if (in_top) {
    line1.setAttribute('x1', Math.round(x_top));
    line1.setAttribute('x2', Math.round(x_top));
    line1.setAttribute('opacity', '0.85');
    lastX1 = Math.round(x_top);
    setBarAnn('ann1', x_top, fmtTop(yr_top));
    topHtml = buildOccurrence(x_top, `${val} ${currentEra} — Upper Axis`, true, compBot(yr_top));
  }

  if (is_double) {
    line2.setAttribute('x1', Math.round(x_bot));
    line2.setAttribute('x2', Math.round(x_bot));
    line2.setAttribute('opacity', '0.85');
    lastX2 = Math.round(x_bot);
    setBarAnn('ann2', x_bot, fmtBot(yr_bot));
    botHtml = buildOccurrence(x_bot, `${val} ${currentEra} — Lower Axis`, false, compTop(yr_bot));
  } else if (in_bot && !in_top) {
    line1.setAttribute('x1', Math.round(x_bot));
    line1.setAttribute('x2', Math.round(x_bot));
    line1.setAttribute('opacity', '0.85');
    lastX1 = Math.round(x_bot);
    setBarAnn('ann1', x_bot, fmtBot(yr_bot));
    botHtml = buildOccurrence(x_bot, `${val} ${currentEra} — Lower Axis`, false, compTop(yr_bot));
  }

  let html = '';
  if (is_double) {
    html = `<div class="yr-double"><div>${topHtml}</div><div class="yr-divider"></div><div>${botHtml}</div></div>`;
  } else {
    html = topHtml || botHtml;
  }

  result.innerHTML = html;
  result.style.display = 'block';
  result.style.width = is_double ? 'max-content' : '100%';
}

</script>

<div id="yearOverlay">
  <div class="overlay-controls">
  <div class="overlay-header"><button id="overlayBack" onclick="closeOverlay()"><span class="back-arrow">&#9664;</span> Back to See Year</button><div class="overlay-nav"><button onclick="navYear(-1)" title="Previous Year">&#9664;</button><button onclick="navYear(1)" title="Next Year">&#9654;</button></div></div>
  <div id="overlayFinder">
    <input type="number" id="overlayInput" placeholder="e.g. 423" min="1" max="6000" onfocus="this.value='';" onkeydown="if(event.key==='Enter')overlayFindBtn();">
    <div class="overlay-era"><button id="overlayBC" class="active" onclick="setOverlayEra('BC')">BC</button><button id="overlayAD" onclick="setOverlayEra('AD')">AD</button></div>
    <button id="overlayFindBtn" onclick="overlayFindBtn()">Find</button>
  </div>
  </div>
  <div id="overlayContent"></div>
</div>
</body>
</html>
