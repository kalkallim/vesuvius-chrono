<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anno Mundi Evolution</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1e;
    color: #e8e4d8;
    font-family: 'Georgia', 'Times New Roman', serif;
    padding: 24px 12px;
    min-height: 100vh;
  }

  .chart-wrapper { width: 100%; max-width: min(1600px, calc(90vh * 1600 / 946)); margin: 0 auto; }

  svg { display: block; width: 100%; height: auto; min-width: 320px; }

  #tooltip {
    position: fixed;
    background: rgba(8,8,12,0.97);
    border: 1px solid #c8b98a;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    pointer-events: none;
    z-index: 9999;
    width: max-content;
    max-width: calc(100vw - 24px);
    display: none;
    box-shadow: 0 4px 24px rgba(0,0,0,0.7);
    line-height: 1.7;
    box-sizing: border-box;
  }

  .tt-name  { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing:.08em; margin-bottom:3px; }



  .tt-segs  { margin-top:6px; border-top:1px solid #2a2a2a; padding-top:5px; }

  .year-finder {
    max-width: 1600px;
    margin: 0 auto 14px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .year-finder label {
    font-size: 21px;
    color: #ffffff;
    font-style: italic;
    font-family: Georgia, serif;
  }

  #yearInput {
    width: 130px;
    background: #252530;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e8e4d8;
    font-size: 21px;
    font-family: Georgia, serif;
    padding: 7px 12px;
    text-align: center;
  }

  #yearInput:focus { outline: none; border-color: #c8b98a; }

  .era-toggle { display: flex; gap: 6px; }

  .era-toggle button {
    background: #252530;
    border: 1px solid #ffffff;
    color: #ffffff;
    font-size: 21px;
    font-family: Georgia, serif;
    padding: 7px 16px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
  }

  #btnBC.active { background: #2FA36B; color: #fff; border-color: #2FA36B; font-weight: 700; }

  #btnAD.active { background: #2FA36B; color: #fff; border-color: #2FA36B; font-weight: 700; }

  .era-toggle button:not(.active):hover { background: #1e3a2a; }

  #findBtn {
    background: #2FA36B;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 21px;
    font-family: Georgia, serif;
    font-weight: 700;
    padding: 8px 20px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  #findBtn:hover { background: #2ecc71; }

  .finder-nav { display: flex; gap: 6px; }

  .finder-nav button {
    background: #2FA36B;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 21px;
    font-family: Georgia, serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
  }

  .finder-nav button:hover { background: #2ecc71; }

  #yearOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #1a1a1e;
    z-index: 99999;
    padding: 24px 20px;
    overflow-y: auto;
    flex-direction: column;
  }

  #yearOverlay.active { display: flex; }

  .overlay-controls { align-self: flex-start; display: flex; flex-direction: column; }

  .overlay-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    width: 100%;
  }

  #overlayBack {
    background: #2FA36B;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 17px;
    font-family: Georgia, serif;
    font-weight: 700;
    padding: 0 18px;
    height: 36px;
    cursor: pointer;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #overlayBack .back-arrow { font-size: 20px; line-height: 1; }

  #overlayBack:hover { background: #2ecc71; }

  .overlay-nav { display: flex; gap: 6px; }

  .overlay-nav button {
    background: #2FA36B;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 20px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .overlay-nav button:hover { background: #2ecc71; }

  #overlayFinder {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    width: 100%;
  }

  #overlayInput {
    flex: 1;
    min-width: 50px;
    background: #252530;
    border: 1px solid #444;
    border-radius: 4px;
    color: #e8e4d8;
    font-size: 17px;
    font-family: Georgia, serif;
    padding: 0 10px;
    height: 36px;
    text-align: center;
  }

  #overlayInput:focus { outline: none; border-color: #c8b98a; }

  #overlayFindBtn {
    background: #2FA36B;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 17px;
    font-family: Georgia, serif;
    font-weight: 700;
    height: 36px;
    padding: 0 16px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  #overlayFindBtn:hover { background: #2ecc71; }

  .overlay-era { display: flex; gap: 6px; }

  .overlay-era button {
    background: #252530;
    border: 1px solid #fff;
    color: #fff;
    font-size: 16px;
    font-family: Georgia, serif;
    height: 36px;
    padding: 0 13px;
    cursor: pointer;
    border-radius: 4px;
  }

  #overlayBC.active, #overlayAD.active { background: #2FA36B; border-color: #2FA36B; font-weight: 700; }

  #overlayContent {
    font-size: 13px;
    color: #e8e4d8;
    font-family: Georgia, serif;
    line-height: 1.4;
  }


  #overlayContent .yr-main-date { font-size: 20px; }

  #overlayContent .yr-axis-tag   { font-size: 14px; }

  #overlayContent .yr-comp-date  { font-size: 14px; }

  #overlayContent .yr-comp-num   { font-size: 14px; }

  #overlayContent .yr-row { font-size: 13px; margin-bottom: 1px; white-space: nowrap; }

  #overlayContent .yr-rows { margin-top: 4px; padding-top: 4px; }


  #yearResult {
    font-size: clamp(15px, 1.5vw, 19px);
    color: #e8e4d8;
    font-family: Georgia, serif;
    display: none;
    background: rgba(8,8,12,0.97);
    border: 1px solid #c8b98a;
    border-radius: 6px;
    padding: 8px 14px;
    width: 100%;
    max-width: min(1600px, calc(90vh * 1600 / 946));
    box-sizing: border-box;
    line-height: 1.35;
    box-shadow: 0 4px 24px rgba(0,0,0,0.7);
    margin: 6px auto 6px;
    overflow-x: auto;
  }

  .yr-double {
    display: flex;
    gap: 16px;
  }

  .yr-double > div {
    flex: 1 1 0;
    min-width: max-content;
  }

  .yr-double .yr-divider {
    width: 1px;
    background: #333;
    margin: 0;
    flex: none;
  }

  .yr-main-date  { color: #ffffff; font-weight: bold; font-size: clamp(20px,1.9vw,25px); }

  .yr-axis-tag   { color: #e8e4d8; font-size: clamp(14px,1.3vw,17px); font-weight: normal; margin-left: 4px; }

  .yr-comp-date  { color: #e8e4d8; font-size: clamp(13px,1.2vw,16px); margin-bottom:3px; }

  .yr-comp-num   { color: #ffffff; font-size: clamp(16px,1.5vw,20px); font-weight: bold; }




  .yr-rows  { margin-top: 4px; border-top: 1px solid #2a2a2a; padding-top: 3px; }

  .yr-row   { font-size: 15px; color: #888; margin-bottom: 1px; white-space: nowrap; }

  .yr-row span { color: #c8b98a; }

  .yr-divider { border-top: 1px solid #333; margin: 4px 0; }
</style>
</head>

  <div class="finder-nav"><button onclick="finderNav(-1)" title="Previous Year">&#9664;</button><button onclick="finderNav(1)" title="Next Year">&#9654;</button></div>
</div>

const svg       = document.getElementById('chart');
const overlay   = document.getElementById('hover-overlay');
// Auto-extend hover overlay to cover all rows whenever ROWS changes
(function() {
  const lastRow = ROWS[ROWS.length - 1];
  const needed = (lastRow.y + 50) - 100;
  overlay.setAttribute('height', needed);
})();
const chartWrapperEl = document.querySelector('.chart-wrapper');
const yearFinderEl   = document.querySelector('.year-finder');
const crosshair = document.getElementById('crosshair');
const tooltip   = document.getElementById('tooltip');

function getSVGX(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
  return Math.max(PLOT_X0, Math.min(PLOT_X0+PLOT_W, loc.x));
}

function topYear(svgX) {
  // returns signed year: positive = BC, negative = AD (no year zero)
  const yrsFromStart = (svgX - PLOT_X0) / PX_PER_YR;
  return 5600 - yrsFromStart;
}

function vatAM(svgX) {
  // AM relative to shared 5600 BC creation anchor (Manetho & Septuagint)
  return (svgX - PLOT_X0) / PX_PER_YR + 1;
}

function amDisplay(raw) {
  const r = Math.round(raw);
  if (r === 0) return raw > 0 ? 1 : -1;
  return r;
}

function getActiveSeg(row, svgX) {
  for (const seg of row.segments) {
    if (svgX >= seg.x && svgX < seg.x + seg.w) return seg;
  }
  if (svgX < row.segments[0].x) return row.segments[0];
  return row.segments[row.segments.length-1];
}

let currentEra = 'BC';
function setEra(era) {
  currentEra = era;
  document.getElementById('btnBC').classList.toggle('active', era==='BC');
  document.getElementById('btnAD').classList.toggle('active', era==='AD');
  const v = document.getElementById('yearInput').value;
  if (v && !isNaN(parseFloat(v))) findYear();
}

function buildOccurrence(svgX, primaryTag) {
  const yr = topYear(svgX);
  const botYr = compBot(yr);
  const isTopPrimary = primaryTag !== 'Lower Axis';
  const primaryDate   = isTopPrimary ? fmtTop(yr) : fmtBot(botYr);
  const primaryLabel  = isTopPrimary ? 'Top Axis' : 'Lower Axis';
  const secondaryDate = isTopPrimary ? fmtBot(botYr) : fmtTop(yr);
  const secondaryLabel= isTopPrimary ? 'Lower Axis' : 'Top Axis';
  let html = `<div style="margin-bottom:1px;white-space:nowrap"><span class="yr-main-date">${primaryDate}</span><span class="yr-axis-tag">${primaryLabel}</span></div>`;
  html += `<div style="margin-bottom:1px;white-space:nowrap"><span class="yr-comp-num">${secondaryDate}</span><span class="yr-axis-tag">${secondaryLabel}</span></div>`;
  html += `<div class="yr-rows">`;
  for (const row of ROWS) {
    const seg = getActiveSeg(row, svgX);
    const rc = seg.color;
    if (row.noAM) {
      html += `<div class="yr-row">${row.shortName}: <span style="color:${rc}">&#9632;</span></div>`;
    } else {
      const am = amDisplay(vatAM(svgX) + (row.amOffset || 0));
      const DARK = ['#0a0a0a','#1a1a1a','#2a2a2a','#3a3a3a','#000000','#000','transparent'];
      const inBounds = row.segments.some(s => svgX >= s.x && svgX < s.x + s.w);
      const amColor = !inBounds ? '#888888' : DARK.includes(rc) ? '#ffffff' : rc;
      html += `<div class="yr-row">${row.shortName}: <span style="color:${amColor}">${am} AM</span></div>`;
    }
  }
  html += `</div>`;
  return html;
}

function showCrosshair(svgX) {
  crosshair.setAttribute('x1', svgX);
  crosshair.setAttribute('x2', svgX);
  crosshair.setAttribute('opacity', 1);
}

function hideCrosshair() {
  crosshair.setAttribute('opacity', 0);
}


// ── Snap-to-boundary: collect every segment start/end x across all rows ────
function collectBoundaries() {
  const xs = new Set();
  for (const row of ROWS) {
    for (const seg of row.segments) {
      xs.add(Math.round(seg.x * 100) / 100);
      xs.add(Math.round((seg.x + seg.w) * 100) / 100);
    }
  }
  return Array.from(xs);
}

// Known transmission-line x-positions: when a block boundary sits within 6 years
// (1.5px) of one of these, snap to the line itself rather than the slightly
// divergent boundary.
const TRANSMISSION_XS = [792.75, 1042.5, 1315.25, 1426.375, 1222.5, 1591.125, 1478.0, 1440.12, 1603.5, 1594.13, 759.0, 1289.0];
const TRANSMISSION_SNAP_PX = 1.5;

const BOUNDARY_XS = collectBoundaries().filter(bx =>
  !TRANSMISSION_XS.some(tx => Math.abs(bx - tx) < TRANSMISSION_SNAP_PX)
);

const SNAP_PX = 3;
function snapX(x) {
  let best = x, bestDist = SNAP_PX;
  // Transmission lines take priority within their own (smaller) threshold first
  for (const tx of TRANSMISSION_XS) {
    const d = Math.abs(tx - x);
    if (d < bestDist) { bestDist = d; best = tx; }
  }
  for (const bx of BOUNDARY_XS) {
    const d = Math.abs(bx - x);
    if (d < bestDist) { bestDist = d; best = bx; }
  }
  return best;
}

// Position tooltip near cursor. Uses hysteresis on the flip decision so it does not
// flicker left/right when the cursor hovers near the right-edge threshold.
let ttSide = 'right';           // current committed side
let ttWidth = 260;              // cached tooltip width (updated after content changes)
const TT_GAP = 16;
function applyTooltipPos(clientX, clientY) {
  const vw = window.innerWidth || 99999;
  // Hysteresis: flip to left only once the tooltip's right edge would clearly overflow,
  // and flip back to right only once there is clear room again. The dead-band (the gap
  // between the two thresholds) prevents oscillation.
  const wouldOverflow = clientX + TT_GAP + ttWidth > vw - 4;
  const hasClearRoom  = clientX + TT_GAP + ttWidth < vw - 40; // 36px dead-band
  if (ttSide === 'right' && wouldOverflow) ttSide = 'left';
  else if (ttSide === 'left' && hasClearRoom) ttSide = 'right';
  const left = (ttSide === 'left') ? Math.max(8, clientX - ttWidth - TT_GAP)
                                   : clientX + TT_GAP;
  tooltip.style.left = left + 'px';
  tooltip.style.top  = (clientY + TT_GAP) + 'px';
}
function positionTooltip(clientX, clientY) {
  // Content just changed: measure once (next frame) to refresh cached width, then place.
  applyTooltipPos(clientX, clientY);
  requestAnimationFrame(() => {
    const tw = tooltip.offsetWidth || 0;
    if (tw) { ttWidth = tw; applyTooltipPos(clientX, clientY); }
  });
}

let lastHoverX = null;
overlay.addEventListener('mousemove', (evt) => {
  const x = snapX(getSVGX(evt));
  showCrosshair(x);
  if (x !== lastHoverX) {
    lastHoverX = x;
    const yr = topYear(x);
    const r = buildDualHtml(yr);
    tooltip.innerHTML = r.html;
    tooltip.style.display = 'block';
    positionTooltip(evt.clientX, evt.clientY);
  } else {
    // Content unchanged: reposition using the same hysteresis logic (no reflow-forcing remeasure)
    applyTooltipPos(evt.clientX, evt.clientY);
  }
});

overlay.addEventListener('mouseleave', () => {
  hideCrosshair();
  tooltip.style.display = 'none';
});

overlay.addEventListener('click', (evt) => {
  const x = getSVGX(evt);
  const yr = topYear(x);
  const displayYr = yr > 0 ? Math.round(yr) : Math.floor(-yr) + 1;
  document.getElementById('yearInput').value = displayYr;
  setEra(yr > 0 ? 'BC' : 'AD');
  findYear();
  const res = document.getElementById('yearResult');
  if (res) res.scrollIntoView({behavior:'smooth', block:'nearest'});
});

// Touch support: touch-and-hold shows the live hover tooltip; releasing hides it
// and restores the previous yearfinder lookup (static badges/lines).
function touchHover(touch) {
  const fakeEvt = { clientX: touch.clientX, clientY: touch.clientY };
  const x = snapX(getSVGX(fakeEvt));
  showCrosshair(x);
  const yr = topYear(x);
  const r = buildDualHtml(yr);
  tooltip.innerHTML = r.html;
  tooltip.style.display = 'block';
  positionTooltip(touch.clientX, touch.clientY);
}
overlay.addEventListener('touchstart', (evt) => {
  evt.preventDefault();
  touchHover(evt.touches[0]);
}, {passive:false});

overlay.addEventListener('touchmove', (evt) => {
  evt.preventDefault();
  touchHover(evt.touches[0]);
}, {passive:false});

overlay.addEventListener('touchend', (evt) => {
  evt.preventDefault();
  // Release: hide the transient hover tooltip + crosshair...
  hideCrosshair();
  tooltip.style.display = 'none';
  // ...and commit the RELEASED year as the new static yearfinder lookup
  // (that year becomes the "previous" lookup, shown via static tooltip + badges + lines).
  const touch = evt.changedTouches[0];
  const x = getSVGX({ clientX: touch.clientX, clientY: touch.clientY });
  const yr = topYear(x);
  document.getElementById('yearInput').value = Math.round(Math.abs(yr));
  setEra(yr >= 0 ? 'BC' : 'AD');
  findYear();
}, {passive:false});

function yearToSVGX(yr) {
  // yr: positive=BC, negative=AD, no year zero (per topYear convention)
  const yrsFromStart = 5600 - yr;
  return PLOT_X0 + yrsFromStart * PX_PER_YR;
}

// ── Annotation boxes overlaid on Official History + Tertullian rows ───────
function setBarAnn(prefix, svgX, label) {
  const rect = document.getElementById('ann-' + prefix + '-rect');
  const text = document.getElementById('ann-' + prefix + '-text');
  if (!rect || !text) return;
  text.textContent = label;
  // box sits left of the line, sized for 35px date text
  const w = Math.max(90, label.length * 20 + 24);
  const gap = 8;
  let bx = svgX - gap - w;
  bx = Math.max(PLOT_X0, bx);
  rect.setAttribute('x', bx);
  rect.setAttribute('width', w);
  rect.setAttribute('opacity', 1);
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('x', bx + w / 2);
  text.setAttribute('opacity', 1);
}

function clearBarAnn(prefix) {
  const rect = document.getElementById('ann-' + prefix + '-rect');
  const text = document.getElementById('ann-' + prefix + '-text');
  if (rect) rect.setAttribute('opacity', 0);
  if (text) text.setAttribute('opacity', 0);
}


// ── Shared dual-alignment HTML builder (used by both findYear and hover) ───
function buildDualHtml(signedYr) {
  const x_top = yearToSVGX(signedYr);
  const x_bot = yearToSVGX(signedYr + VESUAM_OFFSET);

  const in_top = x_top >= PLOT_X0 && x_top <= PLOT_X0 + PLOT_W;
  const in_bot = x_bot >= PLOT_X0 && x_bot <= PLOT_X0 + PLOT_W;
  const is_double = in_top && in_bot && Math.abs(x_top - x_bot) > 2;

  let topHtml = '', botHtml = '';
  if (in_top) topHtml = buildOccurrence(x_top, 'Top Axis');
  if (is_double) botHtml = buildOccurrence(x_bot, 'Lower Axis');
  else if (in_bot && !in_top) botHtml = buildOccurrence(x_bot, 'Lower Axis');

  let html;
  if (is_double) {
    html = `<div class="yr-double"><div>${topHtml}</div><div class="yr-divider"></div><div>${botHtml}</div></div>`;
  } else {
    html = topHtml || botHtml;
  }
  return { html, x_top, x_bot, in_top, in_bot, is_double };
}


function clearPreviousSearch() {
  const result = document.getElementById('yearResult');
  result.style.display = 'none';
  result.innerHTML = '';
  document.getElementById('finder-line-1').setAttribute('opacity', '0');
  document.getElementById('finder-line-2').setAttribute('opacity', '0');
  clearBarAnn('off'); clearBarAnn('ter');
}

document.addEventListener('click', (evt) => {
  const inChart   = chartWrapperEl && chartWrapperEl.contains(evt.target);
  const inFinder  = yearFinderEl && yearFinderEl.contains(evt.target);
  const inResult  = document.getElementById('yearResult').contains(evt.target);
  if (!inChart && !inFinder && !inResult) {
    clearPreviousSearch();
  }
});

function findYear() {
  const val = parseFloat(document.getElementById('yearInput').value);
  if (isNaN(val)) return;
  const isBC = currentEra === 'BC';
  const signedYr = isBC ? val : -(val - 1); // shift AD input by -1 to correct for missing year 0

  const line1 = document.getElementById('finder-line-1');
  const line2 = document.getElementById('finder-line-2');
  line1.setAttribute('opacity', '0');
  line2.setAttribute('opacity', '0');
  clearBarAnn('off'); clearBarAnn('ter');

  const result = document.getElementById('yearResult');
  const r = buildDualHtml(signedYr);

  if (!r.in_top && !r.in_bot) {
    result.innerHTML = `<span style="color:#888">${val} ${currentEra} is outside the chart range.</span>`;
    result.style.display = 'block';
    result.style.width = '100%';
    return;
  }

  if (r.in_top) {
    line1.setAttribute('x1', r.x_top);
    line1.setAttribute('x2', r.x_top);
    line1.setAttribute('opacity', '0.85');
    setBarAnn('off', r.x_top, `${val} ${currentEra}`);
  }
  if (r.is_double) {
    line2.setAttribute('x1', r.x_bot);
    line2.setAttribute('x2', r.x_bot);
    line2.setAttribute('opacity', '0.85');
    setBarAnn('ter', r.x_bot, `${val} ${currentEra}`);
  } else if (r.in_bot && !r.in_top) {
    line1.setAttribute('x1', r.x_bot);
    line1.setAttribute('x2', r.x_bot);
    line1.setAttribute('opacity', '0.85');
    setBarAnn('off', r.x_bot, `${val} ${currentEra}`);
  }

  result.innerHTML = r.html;
  result.style.display = 'block';
  result.style.width = r.is_double ? 'max-content' : '100%';
}

function finderNav(delta) {
  const input = document.getElementById('yearInput');
  let val = parseFloat(input.value) || 0;
  val += (currentEra === 'BC' ? -delta : delta);
  if (val < 1) { val = 1; }
  input.value = val;
  findYear();
}

document.addEventListener('keydown', (evt) => {
  if (evt.key === 'Escape') clearPreviousSearch();
});
document.getElementById('yearInput').addEventListener('keydown', (evt) => {
  if (evt.key === 'Enter') findYear();
});
