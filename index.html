const svg       = document.getElementById('chart');
const overlay   = document.getElementById('hover-overlay');
const crosshair = document.getElementById('crosshair');
const tooltip   = document.getElementById('tooltip');

function getSVGX(evt) {
  const rect = svg.getBoundingClientRect();
  return (evt.clientX - rect.left) * (1600 / rect.width);
}

function vatAM(svgX) {
  return (svgX - 292) / PX_PER_YR + 1;
}

function amDisplay(raw) {
  const r = Math.round(raw);
  if (r === 0) return raw > 0 ? 1 : -1;
  if (r < 0)  return r - 1;
  return r;
}

function getRowAM(row, svgX) {
  const vat = vatAM(svgX);
  const offset = row.amOffset || 0;
  return amDisplay(vat + offset);
}

function getActiveSeg(row, svgX) {
  for (const seg of row.segments) {
    if (svgX >= seg.x &amp;&amp; svgX <= seg.x + seg.w) return seg;
  }
  return null;
}

let _lastTouchEnd = 0;
overlay.addEventListener('mousemove', (evt) => {
  if (Date.now() - _lastTouchEnd < 500) return;  // suppress synthetic mouse after touch
  const svgX = getSVGX(evt);
  if (svgX < PLOT_X0 || svgX > PLOT_X0 + PLOT_W) return;

  crosshair.setAttribute('x1', svgX);
  crosshair.setAttribute('x2', svgX);
  crosshair.setAttribute('opacity', '0.7');

  const amVal   = vatAM(svgX);
  const topYr   = amVal >= 3760.5 ? amVal - 3760 : amVal - 3761;
  const botYr   = amVal > 5312.5 ? 5312 - amVal : 5313 - amVal;

  let segHTML = '';
  for (const row of ROWS) {
    const amCursor = getRowAM(row, svgX);
    if (amCursor === null) continue;
    const tc = segColor(row, svgX);
    const activeSeg = getActiveSeg(row, svgX);
    let labelText = '\u2014';
    if (activeSeg) {
      labelText = activeSeg.label;
    } else {
      let lastSeg = null;
      for (const seg of row.segments) { if (seg.x <= svgX) lastSeg = seg; }
      if (lastSeg) labelText = lastSeg.label;
    }
    segHTML += `<div style=&quot;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #1e1e1e&quot;>` +
      `<div style=&quot;font-size:12px;font-weight:600;color:${tc}&quot;>${row.shortName} ${amCursor} AM</div>` +
      `<div style=&quot;font-size:11px;color:#666&quot;>${labelText}</div>` +
      `</div>`;
  }

  tooltip.innerHTML =
    `<div class=&quot;tt-name&quot;>Cursor position</div>` +
    `<div class=&quot;tt-top&quot;><span style=&quot;color:#666;font-weight:normal&quot;>Upper Axis: </span>${fmtTop(topYr)}</div>` +
    `<div class=&quot;tt-bot&quot;><span style=&quot;color:#666;font-weight:normal&quot;>Lower Axis: </span>${fmtBot(botYr)}</div>` +
    (segHTML ? `<div class=&quot;tt-segs&quot;>${segHTML}</div>` : '');

  const ttW = 320;
  const ttH = tooltip.scrollHeight || 200;
  const margin = 14;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  let left = evt.clientX + margin;
  if (left + ttW > vw - 4) left = evt.clientX - ttW - margin;
  if (left < 4) left = 4;

  let top = evt.clientY - 12;
  if (top + ttH > vh - 4) top = vh - ttH - 4;
  if (top < 4) top = 4;

  tooltip.style.left    = left + 'px';
  tooltip.style.top     = top + 'px';
  tooltip.style.display = 'block';
});

overlay.addEventListener('mouseleave', () => {
  crosshair.setAttribute('opacity', '0');
  tooltip.style.display = 'none';
});

overlay.addEventListener('click', (evt) => {
  const svgX = getSVGX(evt);
  if (svgX < PLOT_X0 || svgX > PLOT_X0 + PLOT_W) return;
  const amVal  = vatAM(svgX);
  const topYr  = amVal >= 3760.5 ? amVal - 3760 : amVal - 3761;
  const isBC   = topYr <= 0;
  const val    = Math.max(1, Math.round(isBC ? -topYr : topYr));
  const era    = isBC ? 'BC' : 'AD';
  document.getElementById('yearInput').value = val;
  currentEra = era;
  document.getElementById('btnBC').classList.toggle('active', isBC);
  document.getElementById('btnAD').classList.toggle('active', !isBC);
  syncOverlayInput(val, era);
  findYear();
  const res = document.getElementById('yearResult');
  if (res) res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

overlay.addEventListener('touchmove', (evt) => {
  evt.preventDefault();
  const t = evt.touches[0];
  overlay.dispatchEvent(new MouseEvent('mousemove', {clientX:t.clientX, clientY:t.clientY}));
}, {passive:false});

overlay.addEventListener('touchend', (evt) => {
  crosshair.setAttribute('opacity', '0');
  tooltip.style.display = 'none';
  _lastTouchEnd = Date.now();        // prevent synthetic mousemove re-showing TT
  if (evt.changedTouches.length === 1) {
    const t = evt.changedTouches[0];
    overlay.dispatchEvent(new MouseEvent('click', {clientX:t.clientX, clientY:t.clientY}));
  }
});

let currentEra = 'BC';
let lastX1 = null, lastX2 = null;
let overlayVal = 1, overlayEra = 'BC';

function setEra(era) {
  currentEra = era; overlayEra = era;
  document.getElementById('btnBC').classList.toggle('active', era === 'BC');
  document.getElementById('btnAD').classList.toggle('active', era === 'AD');
  document.getElementById('overlayBC').classList.toggle('active', era === 'BC');
  document.getElementById('overlayAD').classList.toggle('active', era === 'AD');
  autoFind();
}
function syncOverlayInput(val, era) {
  document.getElementById('overlayInput').value = val;
  document.getElementById('overlayBC').classList.toggle('active', era === 'BC');
  document.getElementById('overlayAD').classList.toggle('active', era === 'AD');
}
function setOverlayEra(era) {
  currentEra = era; overlayEra = era;
  document.getElementById('overlayBC').classList.toggle('active', era === 'BC');
  document.getElementById('overlayAD').classList.toggle('active', era === 'AD');
  document.getElementById('btnBC').classList.toggle('active', era === 'BC');
  document.getElementById('btnAD').classList.toggle('active', era === 'AD');
  const v = parseInt(document.getElementById('overlayInput').value);
  if (v >= 1) { document.getElementById('yearInput').value = v; findYear(); }
}
function overlayFindBtn() {
  const v = parseInt(document.getElementById('overlayInput').value);
  if (!isNaN(v) &amp;&amp; v >= 1) document.getElementById('yearInput').value = v;
  findYear();
}

document.getElementById('yearInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') findYear();
});

function compBot(T) {

  if (T > 1552) return 1552 - T;
  if (T > 0)    return 1553 - T;
  return -T + 1552;
}
function compTop(B) {

  if (B > 1552) return 1552 - B;
  if (B >= 0)   return 1553 - B;
  return 1552 - B;
}

function segColor(row, x) {

  const am = Math.round(vatAM(x) + (row.amOffset || 0));
  if (am < 1) return '#888';
  function colorOf(seg) {
    return ['#1a1a1a','#555'].includes(seg.color) ? '#bbb'
         : (seg.color === '#e8e4d8' || seg.color === '#aaa') ? '#666'
         : seg.color;
  }
  let cum = 0;
  for (const seg of row.segments) {
    cum += seg.years;
    if (am <= cum + 1) return colorOf(seg);
  }
  return colorOf(row.segments[row.segments.length - 1]);
}

function buildOccurrence(svgX, axisLabel, hideTop, compYear) {
  const dashIdx  = axisLabel.indexOf(' — ');
  const mainDate = dashIdx > 0 ? axisLabel.slice(0, dashIdx) : axisLabel;
  const axisName = dashIdx > 0 ? axisLabel.slice(dashIdx + 3) : '';
  let html = `<div style=&quot;margin-bottom:1px;white-space:nowrap&quot;><span class=&quot;yr-main-date&quot;>${mainDate}</span><span class=&quot;yr-axis-tag&quot;>${axisName}</span></div>`;
  if (hideTop) {
    html += `<div style=&quot;margin-bottom:1px;white-space:nowrap&quot;><span class=&quot;yr-comp-num&quot;>${fmtBot(compYear)}</span><span class=&quot;yr-axis-tag&quot;>Lower Axis</span></div>`;
  } else {
    html += `<div style=&quot;margin-bottom:1px;white-space:nowrap&quot;><span class=&quot;yr-comp-num&quot;>${fmtTop(compYear)}</span><span class=&quot;yr-axis-tag&quot;>Upper Axis</span></div>`;
  }
  html += `<div class=&quot;yr-rows&quot;>`;
  for (const row of ROWS) {
    const am = getRowAM(row, svgX);
    if (am === null) continue;
    const rc = segColor(row, svgX);
    html += `<div class=&quot;yr-row&quot;>${row.shortName}: <span style=&quot;color:${rc}&quot;>${am} AM</span></div>`;
  }
  html += `</div>`;
  return html;
}

function isMobile() {
  return window.innerWidth < 700 || ('ontouchstart' in window &amp;&amp; window.innerWidth < 1024);
}

function closeOverlay() {
  document.getElementById('yearOverlay').classList.remove('active');
}

function autoFind() {
  const val = document.getElementById('yearInput').value;
  if (val &amp;&amp; parseInt(val) >= 1) findYear();
}

function setBarAnn(prefix, svgX, _label) {
  const _amVal = vatAM(svgX);
  const _topYr = _amVal >= 3760.5 ? _amVal - 3760 : _amVal - 3761;
  const _botYr = _amVal > 5312.5  ? 5312 - _amVal  : 5313 - _amVal;
  const topLbl = fmtTop(_topYr);
  const botLbl = fmtBot(_botYr);
  const lOff = document.getElementById(prefix + '-off-line');
  const tOff = document.getElementById(prefix + '-off-text');
  const lTer = document.getElementById(prefix + '-ter-line');
  const tTer = document.getElementById(prefix + '-ter-text');
  const rOff = document.getElementById(prefix + '-off-rect');
  const rTer = document.getElementById(prefix + '-ter-rect');
  const x = Math.round(svgX);
  const pad = 5, textX = x - pad - 2;

  [lOff, lTer].forEach(l => { l.setAttribute('x1',x); l.setAttribute('x2',x); l.setAttribute('opacity','0.9'); });

  tOff.setAttribute('x', textX); tOff.setAttribute('text-anchor','end');
  tOff.textContent = topLbl; tOff.setAttribute('opacity','1');

  tTer.setAttribute('x', textX); tTer.setAttribute('text-anchor','end');
  tTer.textContent = botLbl; tTer.setAttribute('opacity','1');

  const wOff = topLbl.length * 15.6, wTer = botLbl.length * 15.6;
  rOff.setAttribute('x', x - wOff - pad*2 - 2); rOff.setAttribute('y','125');
  rOff.setAttribute('width', wOff + pad*2); rOff.setAttribute('height','28'); rOff.setAttribute('opacity','1');
  rTer.setAttribute('x', x - wTer - pad*2 - 2); rTer.setAttribute('y','665');
  rTer.setAttribute('width', wTer + pad*2); rTer.setAttribute('height','28'); rTer.setAttribute('opacity','1');
}

function clearBarAnn(prefix) {
  ['off-line','off-text','ter-line','ter-text','off-rect','ter-rect'].forEach(id => {
    document.getElementById(prefix + '-' + id).setAttribute('opacity', '0');
  });
}

function finderNav(delta) {
  const raw = parseInt(document.getElementById('yearInput').value);
  let val = (isNaN(raw) || raw < 1) ? 423 : raw;
  let era = (isNaN(raw) || raw < 1) ? 'BC' : currentEra;

  let newVal, newEra = era;
  if (era === 'BC') {
    newVal = val - delta;
    if (newVal < 1) { newEra = 'AD'; newVal = 1; }
  } else {
    newVal = val + delta;
    if (newVal < 1) { newEra = 'BC'; newVal = 1; }
  }
  document.getElementById('yearInput').value = newVal;
  currentEra = newEra;
  overlayVal = newVal; overlayEra = newEra;
  document.getElementById('btnBC').classList.toggle('active', newEra === 'BC');
  document.getElementById('btnAD').classList.toggle('active', newEra === 'AD');
  syncOverlayInput(newVal, newEra);
  findYear();
}

function navYear(delta) {

  let v, newEra = overlayEra;
  if (overlayEra === 'BC') {
    v = overlayVal - delta;
    if (v < 1) { newEra = 'AD'; v = 1; }
  } else {
    v = overlayVal + delta;
    if (v < 1) { newEra = 'BC'; v = 1; }
  }
  overlayVal = v;
  overlayEra = newEra;
  currentEra = newEra;
  document.getElementById('yearInput').value = v;
  document.getElementById('btnBC').classList.toggle('active', newEra === 'BC');
  document.getElementById('btnAD').classList.toggle('active', newEra === 'AD');
  syncOverlayInput(v, newEra);
  findYear();
}

function findYear() {
  let val = parseInt(document.getElementById('yearInput').value);
  if (isNaN(val) || val < 1) {
    val = 423; currentEra = 'BC'; overlayVal = 423; overlayEra = 'BC';
    document.getElementById('yearInput').value = 423;
    document.getElementById('btnBC').classList.add('active');
    document.getElementById('btnAD').classList.remove('active');
    syncOverlayInput(423, 'BC');
  }

  const isBC = currentEra === 'BC';

  const yr_top = isBC ? -val : val;
  const yr_bot = isBC ? val : -val;

  const x_top = 292 + ((yr_top > 0 ? yr_top - 1 : yr_top) + 3760) * PX_PER_YR;
  const x_bot = 292 + (yr_bot < 0 ? 5311 - yr_bot : 5312 - yr_bot) * PX_PER_YR;

  const in_top = x_top >= PLOT_X0 &amp;&amp; x_top <= PLOT_X0 + PLOT_W;
  const in_bot = x_bot >= PLOT_X0 &amp;&amp; x_bot <= PLOT_X0 + PLOT_W;
  const is_double = in_top &amp;&amp; in_bot &amp;&amp; Math.abs(x_top - x_bot) > 2;

  const line1 = document.getElementById('finder-line-1');
  const line2 = document.getElementById('finder-line-2');

  lastX1 = null; lastX2 = null;

  line1.setAttribute('opacity', '0');
  line2.setAttribute('opacity', '0');
  clearBarAnn('ann1'); clearBarAnn('ann2');

  const result = document.getElementById('yearResult');

  if (!in_top &amp;&amp; !in_bot) {
    result.innerHTML = `<span style=&quot;color:#888&quot;>${val} ${currentEra} is outside the chart range.</span>`;
    result.style.display = 'block';
    return;
  }

  let topHtml = '';
  let botHtml = '';

  if (in_top) {
    line1.setAttribute('x1', Math.round(x_top));
    line1.setAttribute('x2', Math.round(x_top));
    line1.setAttribute('opacity', '0.85');
    lastX1 = Math.round(x_top);
    setBarAnn('ann1', x_top, fmtTop(yr_top));
    topHtml = buildOccurrence(x_top, `${val} ${currentEra} — Upper Axis`, true, compBot(yr_top));
  }

  if (is_double) {
    line2.setAttribute('x1', Math.round(x_bot));
    line2.setAttribute('x2', Math.round(x_bot));
    line2.setAttribute('opacity', '0.85');
    lastX2 = Math.round(x_bot);
    setBarAnn('ann2', x_bot, fmtBot(yr_bot));
    botHtml = buildOccurrence(x_bot, `${val} ${currentEra} — Lower Axis`, false, compTop(yr_bot));
  } else if (in_bot &amp;&amp; !in_top) {
    line1.setAttribute('x1', Math.round(x_bot));
    line1.setAttribute('x2', Math.round(x_bot));
    line1.setAttribute('opacity', '0.85');
    lastX1 = Math.round(x_bot);
    setBarAnn('ann1', x_bot, fmtBot(yr_bot));
    botHtml = buildOccurrence(x_bot, `${val} ${currentEra} — Lower Axis`, false, compTop(yr_bot));
  }

  let html = '';
  if (is_double) {
    html = `<div class=&quot;yr-double&quot;><div>${topHtml}</div><div class=&quot;yr-divider&quot;></div><div>${botHtml}</div></div>`;
  } else {
    html = topHtml || botHtml;
  }

  result.innerHTML = html;
  result.style.display = 'block';
  result.style.width = is_double ? 'max-content' : '100%';
}

function getSVGX(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
  return Math.max(PLOT_X0, Math.min(PLOT_X0+PLOT_W, loc.x));
}

function topYear(svgX) {
  // returns signed year: positive = BC, negative = AD (no year zero)
  const yrsFromStart = (svgX - PLOT_X0) / PX_PER_YR;
  return 5600 - yrsFromStart;
}

function vatAM(svgX) {
  // AM relative to shared 5600 BC creation anchor (Manetho &amp; Septuagint)
  return (svgX - PLOT_X0) / PX_PER_YR + 1;
}

function amDisplay(raw) {
  const r = Math.round(raw);
  if (r === 0) return raw > 0 ? 1 : -1;
  return r;
}

function getActiveSeg(row, svgX) {
  // Boundary ownership: a shared edge belongs to the segment ENDING there (the left one),
  // so the boundary year (e.g. the flood at AM 1657) reads as the last year of the ending
  // segment (red), not the first year of the next (orange).
  // EXCEPTION: the gray &quot;Claimed Septuagint&quot; annotation bar is pre-creation and gives up its
  // right edge to the red creation bar, so the creation origin reads RED / AM 1 (not gray).
  const segs = row.segments;
  const originIdx = segs.findIndex(s => (s.label || '') !== 'Claimed Septuagint');
  for (let i = 0; i < segs.length; i++) {
    const seg = segs[i];
    const lo = seg.x, hi = seg.x + seg.w;
    const isGray = (seg.label || '') === 'Claimed Septuagint';
    const isOrigin = i === originIdx;
    if (isGray) {
      // pre-creation annotation: left-inclusive, right-EXCLUSIVE (yields creation edge to red)
      if (svgX >= lo &amp;&amp; svgX < hi) return seg;
    } else if (isOrigin) {
      // first real segment (red): owns its left edge (AM 1 origin) and right edge
      if (svgX >= lo &amp;&amp; svgX <= hi) return seg;
    } else {
      // subsequent segments: (lo, hi] — shared boundary goes to the LEFT (ending) segment
      if (svgX > lo &amp;&amp; svgX <= hi) return seg;
    }
  }
  if (svgX < segs[0].x) return segs[0];
  return segs[segs.length-1];
}

let currentEra = 'BC';

function buildOccurrence(svgX, primaryTag) {
  const yr = topYear(svgX);
  const botYr = compBot(yr);
  const isTopPrimary = primaryTag !== 'Lower Axis';
  const primaryDate   = isTopPrimary ? fmtTop(yr) : fmtBot(botYr);
  const primaryLabel  = isTopPrimary ? 'Top Axis' : 'Lower Axis';
  const secondaryDate = isTopPrimary ? fmtBot(botYr) : fmtTop(yr);
  const secondaryLabel= isTopPrimary ? 'Lower Axis' : 'Top Axis';
  let html = `<div style=&quot;margin-bottom:1px;white-space:nowrap&quot;><span class=&quot;yr-main-date&quot;>${primaryDate}</span><span class=&quot;yr-axis-tag&quot;>${primaryLabel}</span></div>`;
  html += `<div style=&quot;margin-bottom:1px;white-space:nowrap&quot;><span class=&quot;yr-comp-num&quot;>${secondaryDate}</span><span class=&quot;yr-axis-tag&quot;>${secondaryLabel}</span></div>`;
  html += `<div class=&quot;yr-rows&quot;>`;
  for (const row of ROWS) {
    if (row.hideFromTooltip) continue;
    const seg = getActiveSeg(row, svgX);
    const rc = seg.color;
    if (row.noAM) {
      html += `<div class=&quot;yr-row&quot;>${row.shortName}: <span style=&quot;color:${rc}&quot;>&#9632;</span></div>`;
    } else {
      const am = amDisplay(vatAM(svgX) + (row.amOffset || 0));
      const DARK = ['#0a0a0a','#1a1a1a','#2a2a2a','#3a3a3a','#000000','#000','transparent'];
      const inBounds = svgX >= row.segments[0].x &amp;&amp; svgX <= row.segments[row.segments.length-1].x + row.segments[row.segments.length-1].w;
      const amColor = !inBounds ? '#888888' : DARK.includes(rc) ? '#ffffff' : rc;
      html += `<div class=&quot;yr-row&quot;>${row.shortName}: <span style=&quot;color:${amColor}&quot;>${am} AM</span></div>`;
    }
  }
  html += `</div>`;
  return html;
}

// ── Snap-to-boundary: collect every segment start/end x across all rows ────
function collectBoundaries() {
  const xs = new Set();
  for (const row of ROWS) {
    for (const seg of row.segments) {
      xs.add(Math.round(seg.x * 100) / 100);
      xs.add(Math.round((seg.x + seg.w) * 100) / 100);
    }
  }
  return Array.from(xs);
}

// Known transmission-line x-positions: when a block boundary sits within 6 years
// (1.5px) of one of these, snap to the line itself rather than the slightly
// divergent boundary.
const TRANSMISSION_XS = [792.75, 1042.5, 1315.25, 1426.375, 1222.5, 1591.125, 1478.0, 1440.12, 1603.5, 1594.13, 759.0, 1289.0, 644.0];
const TRANSMISSION_SNAP_PX = 1.5;

const BOUNDARY_XS = collectBoundaries().filter(bx =>
  !TRANSMISSION_XS.some(tx => Math.abs(bx - tx) < TRANSMISSION_SNAP_PX)
);

const SNAP_PX = 8;
function snapX(x) {
  let best = x, bestDist = SNAP_PX;
  // Transmission lines take priority within their own (smaller) threshold first
  for (const tx of TRANSMISSION_XS) {
    const d = Math.abs(tx - x);
    if (d < bestDist) { bestDist = d; best = tx; }
  }
  for (const bx of BOUNDARY_XS) {
    const d = Math.abs(bx - x);
    if (d < bestDist) { bestDist = d; best = bx; }
  }
  return best;
}

// Position tooltip near cursor. Uses hysteresis on the flip decision so it does not
// flicker left/right when the cursor hovers near the right-edge threshold.
let ttSide = 'right';           // current committed side
let ttWidth = 260;              // cached tooltip width (updated after content changes)
const TT_GAP = 16;
function applyTooltipPos(clientX, clientY) {
  const vw = window.innerWidth || 99999;
  const vh = window.innerHeight || 99999;
  // Hysteresis: flip to left only once the tooltip's right edge would clearly overflow,
  // and flip back to right only once there is clear room again. The dead-band (the gap
  // between the two thresholds) prevents oscillation.
  const wouldOverflow = clientX + TT_GAP + ttWidth > vw - 4;
  const hasClearRoom  = clientX + TT_GAP + ttWidth < vw - 40; // 36px dead-band
  if (ttSide === 'right' &amp;&amp; wouldOverflow) ttSide = 'left';
  else if (ttSide === 'left' &amp;&amp; hasClearRoom) ttSide = 'right';
  const left = (ttSide === 'left') ? Math.max(8, clientX - ttWidth - TT_GAP)
                                   : clientX + TT_GAP;
  tooltip.style.left = left + 'px';
  // Vertical: default below the cursor, but clamp so the tooltip is never clipped by the
  // bottom of the window. If it would overflow the bottom, place it above the cursor; if
  // that still overflows (very tall tooltip), pin it to the top with an 8px margin.
  const th = tooltip.offsetHeight || 0;
  let top = clientY + TT_GAP;
  if (top + th > vh - 8) {
    const above = clientY - TT_GAP - th;
    top = (above >= 8) ? above : Math.max(8, vh - th - 8);
  }
  tooltip.style.top = top + 'px';
}
function positionTooltip(clientX, clientY) {
  // Content just changed: measure once (next frame) to refresh cached width, then place.
  applyTooltipPos(clientX, clientY);
  requestAnimationFrame(() => {
    const tw = tooltip.offsetWidth || 0;
    if (tw) { ttWidth = tw; applyTooltipPos(clientX, clientY); }
  });
}

    result.innerHTML = r.html;

}

    tooltip.style.display = 'block';
    positionTooltip(evt.clientX, evt.clientY);
    // If the static box is live, also keep its readout in sync with the hovered year.
    if (staticActive) updateStaticReadout(yr);
  } else {
    // Content unchanged: reposition using the same hysteresis logic (no reflow-forcing remeasure)
    applyTooltipPos(evt.clientX, evt.clientY);
  }
});

overlay.addEventListener('mouseleave', () => {
  hideCrosshair();
  tooltip.style.display = 'none';
  // If the static box is live, revert its readout from the last hovered year back to the
  // committed year (what the user actually clicked), so wandering off doesn't leave a stray value.
  if (staticActive &amp;&amp; committedSignedYr !== null) {
    lastHoverX = null;
    updateStaticReadout(committedSignedYr);
  }
});

overlay.addEventListener('click', (evt) => {
  const x = getSVGX(evt);
  const yr = topYear(x);
  const displayYr = yr > 0 ? Math.round(yr) : Math.floor(-yr) + 1;
  document.getElementById('yearInput').value = displayYr;
  setEra(yr > 0 ? 'BC' : 'AD');
  committedSignedYr = yr;             // remember what was committed (for mouseleave revert)
  tooltip.style.display = 'none';   // hide floating popup; the static box takes over
  findYear();                        // commit: place finder-lines + badges at the clicked year, activate static box
  lastHoverX = null;                 // so the next hover forces a fresh readout update
  const res = document.getElementById('yearResult');
  if (res) res.scrollIntoView({behavior:'smooth', block:'nearest'});
});

// Touch support: touch-and-hold shows the live hover tooltip; releasing hides it
// and restores the previous yearfinder lookup (static badges/lines).
function touchHover(touch) {
  const fakeEvt = { clientX: touch.clientX, clientY: touch.clientY };
  const x = snapX(getSVGX(fakeEvt));
  showCrosshair(x);
  const yr = topYear(x);
  if (staticActive) {
    // Static box is live: update its values as the finger drags, no floating popup.
    updateStaticReadout(yr);
    return;
  }
  const r = buildDualHtml(yr);
  tooltip.innerHTML = r.html;
  tooltip.style.display = 'block';
  positionTooltip(touch.clientX, touch.clientY);
}
overlay.addEventListener('touchstart', (evt) => {
  evt.preventDefault();
  touchHover(evt.touches[0]);
}, {passive:false});

overlay.addEventListener('touchmove', (evt) => {
  evt.preventDefault();
  touchHover(evt.touches[0]);
}, {passive:false});

overlay.addEventListener('touchend', (evt) => {
  evt.preventDefault();
  // Release: hide the transient hover tooltip + crosshair...
  hideCrosshair();
  tooltip.style.display = 'none';
  // ...and commit the RELEASED year as the new static lookup (finder-lines + badges + readout).
  const touch = evt.changedTouches[0];
  const x = getSVGX({ clientX: touch.clientX, clientY: touch.clientY });
  const yr = topYear(x);
  committedSignedYr = yr;
  document.getElementById('yearInput').value = Math.round(Math.abs(yr));
  setEra(yr >= 0 ? 'BC' : 'AD');
  findYear();
  lastHoverX = null;
}, {passive:false});

function yearToSVGX(yr) {
  // yr: positive=BC, negative=AD, no year zero (per topYear convention)
  const yrsFromStart = 5600 - yr;
  return PLOT_X0 + yrsFromStart * PX_PER_YR;
}

// ── Annotation boxes overlaid on Official History + Tertullian rows ───────
function setBarAnn(prefix, svgX, label) {
  const rect = document.getElementById('ann-' + prefix + '-rect');
  const text = document.getElementById('ann-' + prefix + '-text');
  if (!rect || !text) return;
  text.textContent = label;
  // box sits left of the line, sized for 35px date text
  const w = Math.max(90, label.length * 20 + 24);
  const gap = 8;
  let bx = svgX - gap - w;
  bx = Math.max(PLOT_X0, bx);
  rect.setAttribute('x', bx);
  rect.setAttribute('width', w);
  rect.setAttribute('opacity', 1);
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('x', bx + w / 2);
  text.setAttribute('opacity', 1);
}

function clearBarAnn(prefix) {
  const rect = document.getElementById('ann-' + prefix + '-rect');
  const text = document.getElementById('ann-' + prefix + '-text');
  if (rect) rect.setAttribute('opacity', 0);
  if (text) text.setAttribute('opacity', 0);
}

// ── Shared dual-alignment HTML builder (used by both findYear and hover) ───
function buildDualHtml(signedYr) {
  const x_top = yearToSVGX(signedYr);
  const x_bot = yearToSVGX(signedYr - VESUAM_OFFSET);

  const in_top = x_top >= PLOT_X0 &amp;&amp; x_top <= PLOT_X0 + PLOT_W;
  const in_bot = x_bot >= PLOT_X0 &amp;&amp; x_bot <= PLOT_X0 + PLOT_W;
  const is_double = in_top &amp;&amp; in_bot &amp;&amp; Math.abs(x_top - x_bot) > 2;

  let topHtml = '', botHtml = '';
  if (in_top) topHtml = buildOccurrence(x_top, 'Top Axis');
  if (is_double) botHtml = buildOccurrence(x_bot, 'Lower Axis');
  else if (in_bot &amp;&amp; !in_top) botHtml = buildOccurrence(x_bot, 'Lower Axis');

  let html;
  if (is_double) {
    html = `<div class=&quot;yr-double&quot;><div>${topHtml}</div><div class=&quot;yr-divider&quot;></div><div>${botHtml}</div></div>`;
  } else {
    html = topHtml || botHtml;
  }
  return { html, x_top, x_bot, in_top, in_bot, is_double };
}

function clearPreviousSearch() {
  const result = document.getElementById('yearResult');
  result.style.display = 'none';
  result.innerHTML = '';
  document.getElementById('finder-line-1').setAttribute('opacity', '0');
  document.getElementById('finder-line-2').setAttribute('opacity', '0');
  clearBarAnn('off'); clearBarAnn('ter');
}

document.addEventListener('click', (evt) => {
  const inChart   = chartWrapperEl &amp;&amp; chartWrapperEl.contains(evt.target);
  const inFinder  = yearFinderEl &amp;&amp; yearFinderEl.contains(evt.target);
  const inResult  = document.getElementById('yearResult').contains(evt.target);
  if (!inChart &amp;&amp; !inFinder &amp;&amp; !inResult) {
    clearPreviousSearch();
  }
});

function findYear() {
  const val = parseFloat(document.getElementById('yearInput').value);
  if (isNaN(val)) return;
  const isBC = currentEra === 'BC';
  const signedYr = isBC ? val : -(val - 1); // shift AD input by -1 to correct for missing year 0
  committedSignedYr = signedYr;  // this lookup is now the committed value (readout reverts here on mouse leave)

  const line1 = document.getElementById('finder-line-1');
  const line2 = document.getElementById('finder-line-2');
  line1.setAttribute('opacity', '0');
  line2.setAttribute('opacity', '0');
  clearBarAnn('off'); clearBarAnn('ter');

  const result = document.getElementById('yearResult');
  const r = buildDualHtml(signedYr);

  if (!r.in_top &amp;&amp; !r.in_bot) {
    result.innerHTML = `<span style=&quot;color:#888&quot;>${val} ${currentEra} is outside the chart range.</span>`;
    result.style.display = 'block';
    result.style.width = '100%';
    staticActive = true;
    return;
  }

  if (r.in_top) {
    line1.setAttribute('x1', r.x_top);
    line1.setAttribute('x2', r.x_top);
    line1.setAttribute('opacity', '0.85');
    setBarAnn('off', r.x_top, `${val} ${currentEra}`);
  }
  if (r.is_double) {
    line2.setAttribute('x1', r.x_bot);
    line2.setAttribute('x2', r.x_bot);
    line2.setAttribute('opacity', '0.85');
    setBarAnn('ter', r.x_bot, `${val} ${currentEra}`);
  } else if (r.in_bot &amp;&amp; !r.in_top) {
    line1.setAttribute('x1', r.x_bot);
    line1.setAttribute('x2', r.x_bot);
    line1.setAttribute('opacity', '0.85');
    setBarAnn('off', r.x_bot, `${val} ${currentEra}`);
  }

  result.innerHTML = r.html;
  result.style.display = 'block';
  result.style.width = r.is_double ? 'max-content' : '100%';
  staticActive = true;  // static box now live; subsequent hover updates it instead of the popup
}

// ── Arrow-key year navigation (active after a lookup) ─────────────────────
// Once a year is committed (via Find, click, or tap), Left/Right step the year by 1,
// Up/Down step by 10. Steps move through the signed-year timeline (BC decreasing toward
// AD), update the input + era, and re-run the lookup so finder-lines and readout follow.
function stepCommittedYear(delta) {
  if (committedSignedYr === null) return;
  // signedYr: positive = BC, negative = AD, no year zero. Moving toward the present = -delta.
  let next = committedSignedYr - delta;
  // skip year zero (signed 0 doesn't exist): jump from 1 BC (+1) to 1 AD (-1) and back.
  if (next === 0) next = (delta > 0) ? -1 : 1;
  committedSignedYr = next;
  // reflect into the input + era controls
  const isBC = next > 0;
  const displayYr = isBC ? Math.round(next) : Math.floor(-next) + 1;
  setEra(isBC ? 'BC' : 'AD');
  document.getElementById('yearInput').value = displayYr;
  findYear();
}
document.addEventListener('keydown', (e) => {
  // Only when a lookup is active, and not while typing in the year input.
  if (!staticActive) return;
  const active = document.activeElement;
  if (active &amp;&amp; active.id === 'yearInput') return; // let the input handle its own keys
  let delta = 0;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   delta = (e.key === 'ArrowUp')   ? 10 : 1;
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') delta = (e.key === 'ArrowDown') ? -10 : -1;
  if (delta === 0) return;
  e.preventDefault();
  // Right/Up move toward the present (fewer BC years); Left/Down move toward the past.
  stepCommittedYear(delta);
});

function finderNav(delta) {
  const input = document.getElementById('yearInput');
  let val = parseFloat(input.value) || 0;
  val += (currentEra === 'BC' ? -delta : delta);
  if (val < 1) { val = 1; }
  input.value = val;
  findYear();
}

document.addEventListener('keydown', (evt) => {
  if (evt.key === 'Escape') clearPreviousSearch();
});
document.getElementById('yearInput').addEventListener('keydown', (evt) => {
  if (evt.key === 'Enter') findYear();
});
</script>
</body>

"></iframe>
</div>

<script>
(function(){
  var A=document.getElementById('frameA'), B=document.getElementById('frameB');
  var bA=document.getElementById('btnA'), bB=document.getElementById('btnB');
  var ttl=document.getElementById('chartTitle'), sub=document.getElementById('chartSub');
  var META={A:{t:'The 1552 Offset',   s:'Hebrew Seder Olam against the Codex Vaticanus'},
            B:{t:'Anno Mundi Evolution', s:'the 1060 phantom offset, decomposed'}};
  var timers={};

  function measure(f){
    var d=f.contentDocument; if(!d||!d.body) return 0;
    var svg=d.querySelector('svg');
    return Math.max(d.documentElement.scrollHeight||0, d.body.scrollHeight||0,
                    svg?(svg.getBoundingClientRect().height+40):0);
  }
  function fit(f){
    if(!f||f.classList.contains('hidden')) return;
    try{
      var prev=f.style.height;
      f.style.height='0px';
      var h=measure(f);
      f.style.height = h? (h+6)+'px' : prev;
    }catch(e){}
  }
  function fitSoon(f){
    clearTimeout(timers[f.id]);
    timers[f.id]=setTimeout(function(){ fit(f); }, 40);
  }

  // grow/shrink the frame whenever inner content changes height
  // (the static year-result box appears above the chart and would otherwise clip it)
  function watch(f){
    try{
      var d=f.contentDocument; if(!d||!d.body) return;
      if(window.ResizeObserver){
        var ro=new ResizeObserver(function(){ fitSoon(f); });
        ro.observe(d.body); ro.observe(d.documentElement);
      } else {
        setInterval(function(){
          if(f.classList.contains('hidden')) return;
          var h=measure(f), cur=parseFloat(f.style.height)||0;
          if(Math.abs(h+6-cur)>4) fit(f);
        }, 400);
      }
      var yr=d.getElementById('yearResult');
      if(yr && window.MutationObserver){
        new MutationObserver(function(){ fitSoon(f); })
          .observe(yr,{attributes:true,attributeFilter:['style','class']});
      }
    }catch(e){}
  }

  function show(which){
    var on=which==='A'?A:B, off=which==='A'?B:A;
    var bon=which==='A'?bA:bB, boff=which==='A'?bB:bA;
    off.classList.add('hidden'); on.classList.remove('hidden');
    bon.classList.add('active');  bon.setAttribute('aria-pressed','true');
    boff.classList.remove('active'); boff.setAttribute('aria-pressed','false');
    ttl.textContent=META[which].t; sub.textContent=META[which].s;
    fit(on); setTimeout(function(){ fit(on); },60);
  }

  bA.addEventListener('click',function(){ show('A'); });
  bB.addEventListener('click',function(){ show('B'); });
  A.addEventListener('load',function(){ fit(A); watch(A); });
  B.addEventListener('load',function(){ fit(B); watch(B); });
  var t=null;
  window.addEventListener('resize',function(){ clearTimeout(t); t=setTimeout(function(){fit(A);fit(B);},120); });
  window.addEventListener('load',function(){ fit(A); fit(B); setTimeout(function(){fit(A);fit(B);},200); });
})();
</script>
